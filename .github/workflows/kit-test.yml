name: kit-test
on:
  workflow_dispatch:
jobs:
  kit:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run build.bat end-to-end
        shell: cmd
        run: dist-kit\build.bat
      - name: Show tail of build.log
        if: always()
        shell: pwsh
        run: Get-Content dist-kit/build.log -Tail 25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kit-exe
          path: |
            dist-kit/dist/*.exe
            dist-kit/build.log
          retention-days: 7
