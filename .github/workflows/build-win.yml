name: build-win

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，如 1.0.0"
        required: false
        default: "0.0.1"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: LGNS-Claimer

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}".TrimStart("v") }
          if (-not $v) { $v = "0.0.1" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build onefile exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "${{ env.APP_NAME }}" `
            app/main.py

      - name: Rename artifact
        shell: pwsh
        run: |
          $out = "${{ env.APP_NAME }}-v${{ steps.ver.outputs.version }}-win64.exe"
          Move-Item "dist/${{ env.APP_NAME }}.exe" "dist/$out"
          Get-Item "dist/$out" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-v${{ steps.ver.outputs.version }}-win64
          path: dist/*.exe
          retention-days: 7